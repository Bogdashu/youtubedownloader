<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>YouTube Downloader</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: #1a1a2e;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    width: 90%;
    max-width: 650px;
    text-align: center;
}

input {
    width: 100%;
    height: 60px;
    border-radius: 30px;
    border: none;
    padding: 0 20px;
    font-size: 16px;
    background: #2a2a40;
    color: white;
}

select, button {
    width: 100%;
    margin-top: 15px;
    height: 50px;
    border-radius: 25px;
    border: none;
}

button {
    background: linear-gradient(90deg,#6366f1,#a855f7);
    color: white;
    cursor: pointer;
}

.progress-bar {
    margin-top: 20px;
    height: 8px;
    background: rgba(255,255,255,0.1);
    border-radius: 20px;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg,#6366f1,#a855f7);
}
</style>
</head>

<body>

<div class="container">

<h1>YouTube Downloader</h1>

<input id="url" placeholder="Вставь ссылку">

<select id="quality">
<option value="360">360p</option>
<option value="1080" selected>1080p (с перемоткой)</option>
</select>

<select id="mode">
<option value="video">Видео + звук</option>
<option value="audio">Только аудио</option>
</select>

<button id="btn">Скачать</button>

<div class="progress-bar">
<div class="progress-fill" id="fill"></div>
</div>

</div>

<script>
const ws = new WebSocket(`ws://${location.host}/ws`);
const fill = document.getElementById('fill');

ws.onmessage = e => {
    const data = JSON.parse(e.data);
    if (data.type === 'progress') {
        fill.style.width = data.value + '%';
    }
};

document.getElementById('btn').onclick = async () => {
    const url = document.getElementById('url').value;

    const res = await fetch('/download', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
            url,
            quality: document.getElementById('quality').value,
            mode: document.getElementById('mode').value
        })
    });

    const blob = await res.blob();

    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'video.mp4';
    a.click();
};
</script>

</body>
</html>
